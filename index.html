<!doctype html>
<html lang="en" data-theme="normal-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/moneta-mark-512.webp" type="image/webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="Moneta — daily expense, budget and savings tracker for any currency. Freelance · Work · Earn · Globally." />
    <meta property="og:title" content="Moneta" />
    <meta property="og:description" content="Track spending, budgets and savings in any currency and any language." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-title" content="Moneta" />
    <title>Moneta — Expense & Budget Tracker</title>
    <!--
      Theme boot: runs blocking before first paint so the saved theme is applied
      immediately (no flash). Mirrors src/theme/theme.ts; falls back to the
      Normal (receipt) style following the OS colour scheme.
    -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('moneta.theme') || 'null') || {};
          var style = p.style || 'normal';
          var mode = p.mode || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', style + '-' + (dark ? 'dark' : 'light'));
          if (dark) root.classList.add('dark');
          if (p.accent) {
            var n = parseInt(p.accent.slice(1), 16);
            root.style.setProperty('--brand', ((n >> 16) & 255) + ' ' + ((n >> 8) & 255) + ' ' + (n & 255));
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex Mono = Normal (default, loaded first); Space Mono = Brutal; Plus Jakarta Sans = Morphism; Noto for Bangla/Devanagari glyphs -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
